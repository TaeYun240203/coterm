name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          asset="coterm_${VERSION}_${GOOS}_${GOARCH}"
          staging="$RUNNER_TEMP/$asset"
          mkdir -p "$staging/skills/coterm-shared-terminal" "$staging/scripts"
          go build -trimpath -ldflags "-s -w -X github.com/coterm/coterm/internal/cli.Version=${VERSION}" -o "$staging/coterm" ./cmd/coterm
          cp skills/coterm-shared-terminal/SKILL.md "$staging/skills/coterm-shared-terminal/SKILL.md"
          cp scripts/install.sh "$staging/scripts/install.sh"
          cp scripts/uninstall.sh "$staging/scripts/uninstall.sh"
          chmod 0755 "$staging/coterm" "$staging/scripts/install.sh" "$staging/scripts/uninstall.sh"
          tar -C "$staging" -czf "$asset.tar.gz" coterm skills scripts

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: coterm-${{ matrix.goos }}-${{ matrix.goarch }}
          path: coterm_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download archive artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          gh release create "$VERSION" dist/*.tar.gz --title "$VERSION"
